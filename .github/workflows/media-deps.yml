name: Media deps

# Verifies the GSAP + Three.js + PixelFX root dependencies install from a clean
# checkout with the pinned Bun, and that they render together in HyperFrames,
# including the vendored Lemo-Opuscar CRT post (vendor/lemo-opuscar) and the
# data-animation chart fixture (bar race, counter, delta, line reveal) and the
# map-animation fixture (camera zoom, country highlight, great-circle route),
# and a Poly Haven scene (glTF model, PBR material, HDRI) fetched through the
# cached, md5-checked polyhaven-assets helper, and a background-removal
# fixture (rembg + U^2-Net cutouts, plate fill, parallax layers), and a
# sound-effects fixture (earshot cues on animation frames, ducked under a
# narration stand-in, checked for loudness, silence and frame sync), and the
# creative demos (real photo with an animated foreground, a rigged character,
# a cinematic camera) and the creative QC repair loop on a deliberately weak cut.

permissions:
  contents: read

env:
  HYPERFRAMES_NO_TELEMETRY: "1"

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - package.json
      - bun.lock
      - vendor/pixelfx/**
      - .claude/skills/gsap-hyperframes/**
      - .github/workflows/media-deps.yml
      - .github/workflows/fixtures/media-deps/**
      - vendor/lemo-opuscar/**
      - .claude/skills/lemo-opuscar-styles/**
      - .github/workflows/fixtures/lemo-opuscar/**
      - .claude/skills/data-animation/**
      - .github/workflows/fixtures/data-animation/**
      - .claude/skills/map-animation/**
      - vendor/natural-earth/**
      - .github/workflows/fixtures/map-animation/**
      - .claude/skills/polyhaven-assets/**
      - .github/workflows/fixtures/polyhaven/**
      - .claude/skills/background-removal/**
      - .github/workflows/fixtures/background-removal/**
      - .claude/skills/sound-effects/**
      - .github/workflows/fixtures/sound-effects/**
      - .claude/skills/visual-director/**
      - .claude/skills/character-animation/**
      - .claude/skills/cinematography/**
      - .claude/skills/creative-qc/**
      - .github/workflows/fixtures/creative/**
  pull_request:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - vendor/pixelfx/**
      - .claude/skills/gsap-hyperframes/**
      - .github/workflows/media-deps.yml
      - .github/workflows/fixtures/media-deps/**
      - vendor/lemo-opuscar/**
      - .claude/skills/lemo-opuscar-styles/**
      - .github/workflows/fixtures/lemo-opuscar/**
      - .claude/skills/data-animation/**
      - .github/workflows/fixtures/data-animation/**
      - .claude/skills/map-animation/**
      - vendor/natural-earth/**
      - .github/workflows/fixtures/map-animation/**
      - .claude/skills/polyhaven-assets/**
      - .github/workflows/fixtures/polyhaven/**
      - .claude/skills/background-removal/**
      - .github/workflows/fixtures/background-removal/**
      - .claude/skills/sound-effects/**
      - .github/workflows/fixtures/sound-effects/**
      - .claude/skills/visual-director/**
      - .claude/skills/character-animation/**
      - .claude/skills/cinematography/**
      - .claude/skills/creative-qc/**
      - .github/workflows/fixtures/creative/**

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: bun
        run: echo "version=$(jq -r .engines.bun package.json)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install from clean checkout (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lockfile unchanged by a fresh resolve
        run: |
          bun install --ignore-scripts
          git diff --exit-code -- bun.lock package.json || {
            echo "::warning::bun install changed bun.lock (see diff above)"
            git diff -- bun.lock > bun-lock-resolve.diff
          }

      - name: Resolve gsap, three, pixelfx
        run: |
          node --input-type=module -e '
            const gsap = (await import("gsap")).gsap;
            const THREE = await import("three");
            const pfx = await import("pixelfx");
            const nova = await import("pixelfx/fx/ice/frost-nova");
            if (typeof pfx.createFx !== "function" || !nova.meta) throw new Error("pixelfx API missing");
            console.log("gsap", gsap.version, "three r" + THREE.REVISION, "pixelfx", nova.meta.name);
          '

      - name: Frame helper tests
        run: node --test .claude/skills/gsap-hyperframes/gsap-frame.test.mjs .claude/skills/gsap-hyperframes/pixelfx-frame.test.mjs .claude/skills/data-animation/data-frame.test.mjs .claude/skills/map-animation/map-frame.test.mjs .claude/skills/polyhaven-assets/polyhaven.test.mjs .claude/skills/background-removal/cutout-frame.test.mjs .claude/skills/sound-effects/sfx-frame.test.mjs .claude/skills/visual-director/visual-director.test.mjs .claude/skills/character-animation/rig-frame.test.mjs .claude/skills/cinematography/camera-frame.test.mjs

      - name: Combined render (GSAP + Three.js + PixelFX)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          W="$RUNNER_TEMP/media-deps"
          mkdir -p "$W/lib/pixelfx"
          cp .github/workflows/fixtures/media-deps/index.html "$W/"
          cp .claude/skills/gsap-hyperframes/gsap-frame.js .claude/skills/gsap-hyperframes/pixelfx-frame.js "$W/"
          cp node_modules/gsap/dist/gsap.min.js node_modules/three/build/three.module.js node_modules/three/build/three.core.js "$W/lib/"
          cp -r node_modules/pixelfx/src/. "$W/lib/pixelfx/"
          cd "$W"
          npx -y hyperframes@0.9.104 lint
          npx -y hyperframes@0.9.104 check
          npx -y hyperframes@0.9.104 render -f 30 -o out.mp4
          frames=$(ffprobe -v error -count_frames -select_streams v -show_entries stream=nb_read_frames -of csv=p=0 out.mp4)
          echo "rendered $frames frames"
          test "$frames" -eq 102

      - name: Lemo-Opuscar helpers resolve against our three
        run: |
          node --input-type=module -e '
            const tp = await import("./vendor/lemo-opuscar/core/three/post.js");
            const crt = await import("./vendor/lemo-opuscar/core/post/crt.js");
            const lib = await import("./vendor/lemo-opuscar/core/lib.js");
            if (typeof tp.makePost !== "function" || typeof crt.makePost !== "function") throw new Error("makePost missing");
            const r = lib.mulberry(7); if (r() !== lib.mulberry(7)()) throw new Error("mulberry not deterministic");
            const rows = (await import("node:fs")).readFileSync("vendor/lemo-opuscar/styles.jsonl", "utf8").trim().split("\n").map(JSON.parse);
            if (rows.length < 90 || rows.some((r) => !r.slug || !r.category)) throw new Error("styles.jsonl invalid");
            console.log("lemo-opuscar ok,", rows.length, "styles");
          '

      - name: Lemo-Opuscar CRT post render (GSAP + Three.js + PixelFX)
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/lemo-opuscar"
          mkdir -p "$W/lib/pixelfx" "$W/lib/lemo"
          cp .github/workflows/fixtures/lemo-opuscar/index.html "$W/"
          cp .claude/skills/gsap-hyperframes/gsap-frame.js "$W/"
          cp node_modules/gsap/dist/gsap.min.js node_modules/three/build/three.module.js node_modules/three/build/three.core.js "$W/lib/"
          cp -r node_modules/pixelfx/src/. "$W/lib/pixelfx/"
          cp -r vendor/lemo-opuscar/core "$W/lib/lemo/"
          cd "$W"
          npx -y hyperframes@0.9.104 lint
          npx -y hyperframes@0.9.104 check
          npx -y hyperframes@0.9.104 render -f 30 -o lemo-crt.mp4
          frames=$(ffprobe -v error -count_frames -select_streams v -show_entries stream=nb_read_frames -of csv=p=0 lemo-crt.mp4)
          echo "rendered $frames frames"
          test "$frames" -eq 90

      - name: Lemo-Opuscar style guide fetch (pinned, not committed)
        run: |
          set -euo pipefail
          test -f .claude/skills/lemo-opuscar-styles/SKILL.md
          url=$(grep -o 'https://raw.githubusercontent.com/lemomo-ai/lemo-opuscar/[0-9a-f]\{40\}/styles/' .claude/skills/lemo-opuscar-styles/SKILL.md | head -1)
          slug=$(head -1 vendor/lemo-opuscar/styles.jsonl | node -e 'process.stdin.on("data",d=>console.log(JSON.parse(d).slug))')
          mkdir -p .lemo/$slug
          curl -fsSL "${url}${slug}/STYLE.md" -o .lemo/$slug/STYLE.md
          test -s .lemo/$slug/STYLE.md
          git check-ignore -q .lemo/$slug/STYLE.md
          echo "fetched $slug STYLE.md ($(wc -c < .lemo/$slug/STYLE.md) bytes), ignored by git"

      - name: Data animation render (bar race, counter, delta, line)
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/data-animation"
          mkdir -p "$W/lib"
          cp .github/workflows/fixtures/data-animation/index.html "$W/"
          cp .claude/skills/gsap-hyperframes/gsap-frame.js .claude/skills/data-animation/data-frame.js "$W/"
          cp node_modules/gsap/dist/gsap.min.js "$W/lib/"
          cd "$W"
          npx -y hyperframes@0.9.104 lint
          npx -y hyperframes@0.9.104 check
          npx -y hyperframes@0.9.104 render -f 30 -o data-animation.mp4
          frames=$(ffprobe -v error -count_frames -select_streams v -show_entries stream=nb_read_frames -of csv=p=0 data-animation.mp4)
          echo "rendered $frames frames"
          test "$frames" -eq 120

      - name: Map animation render (camera zoom, country highlight, route)
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/map-animation"
          mkdir -p "$W/lib"
          cp .github/workflows/fixtures/map-animation/index.html "$W/"
          cp .claude/skills/gsap-hyperframes/gsap-frame.js .claude/skills/map-animation/map-frame.js vendor/natural-earth/countries-110m.js "$W/"
          cp node_modules/gsap/dist/gsap.min.js "$W/lib/"
          cd "$W"
          npx -y hyperframes@0.9.104 lint
          npx -y hyperframes@0.9.104 check
          npx -y hyperframes@0.9.104 render -f 30 -o map-animation.mp4
          frames=$(ffprobe -v error -count_frames -select_streams v -show_entries stream=nb_read_frames -of csv=p=0 map-animation.mp4)
          echo "rendered $frames frames"
          test "$frames" -eq 180

      - name: Poly Haven download cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/hyperframes/polyhaven
          key: polyhaven-${{ hashFiles('.github/workflows/fixtures/polyhaven/scene.json', '.claude/skills/polyhaven-assets/polyhaven.mjs') }}

      - name: Poly Haven render (glTF model, PBR material, HDRI)
        run: |
          set -euo pipefail
          PH="$PWD/.claude/skills/polyhaven-assets/polyhaven.mjs"
          SCENE="$PWD/.github/workflows/fixtures/polyhaven/scene.json"
          W="$RUNNER_TEMP/polyhaven"
          T=node_modules/three
          mkdir -p "$W/lib/three/build" "$W/lib/three/examples/jsm/loaders" "$W/lib/three/examples/jsm/utils" "$W/lib/pixelfx"
          node "$PH" search models rubber duck --limit 3
          # Pick and fetch from the live API (or the restored cache).
          node "$PH" scene "$SCENE" --out "$W"
          node "$PH" cache
          # A clean project offline must come entirely from the cache.
          rm -rf "$W/polyhaven"
          node "$PH" scene "$SCENE" --out "$W" --offline
          node "$PH" verify "$W"
          cat "$W/polyhaven/CREDITS.md"
          du -sh "$W/polyhaven"
          cp .github/workflows/fixtures/polyhaven/index.html .claude/skills/polyhaven-assets/polyhaven-three.js "$W/"
          cp .claude/skills/gsap-hyperframes/gsap-frame.js .claude/skills/gsap-hyperframes/pixelfx-frame.js "$W/"
          cp node_modules/gsap/dist/gsap.min.js "$W/lib/"
          cp $T/build/three.module.js $T/build/three.core.js "$W/lib/three/build/"
          cp $T/examples/jsm/loaders/GLTFLoader.js $T/examples/jsm/loaders/HDRLoader.js "$W/lib/three/examples/jsm/loaders/"
          cp $T/examples/jsm/utils/BufferGeometryUtils.js $T/examples/jsm/utils/SkeletonUtils.js "$W/lib/three/examples/jsm/utils/"
          cp -r node_modules/pixelfx/src/. "$W/lib/pixelfx/"
          cd "$W"
          npx -y hyperframes@0.9.104 lint
          npx -y hyperframes@0.9.104 check
          npx -y hyperframes@0.9.104 render -f 30 -o polyhaven.mp4
          frames=$(ffprobe -v error -count_frames -select_streams v -show_entries stream=nb_read_frames -of csv=p=0 polyhaven.mp4)
          echo "rendered $frames frames"
          test "$frames" -eq 120

      - name: Background removal caches (venv + model weights, processed cutouts)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/hyperframes/rembg
            ~/.cache/hyperframes/cutouts
          key: rembg-${{ runner.os }}-${{ hashFiles('.claude/skills/background-removal/requirements.txt', '.claude/skills/background-removal/cutout.py') }}
          restore-keys: rembg-${{ runner.os }}-

      - name: Background removal render (rembg cutouts, plate, parallax, Three.js, PixelFX)
        run: |
          set -euo pipefail
          SK="$PWD/.claude/skills/background-removal"
          W="$RUNNER_TEMP/background-removal"
          IN="$RUNNER_TEMP/br-in"
          mkdir -p "$W/lib/pixelfx" "$IN"
          "$SK/cutout.sh" models
          "$SK/cutout.sh" selftest
          "$SK/cutout.sh" fetch
          # Public-domain / CC0 photos bundled with scikit-image (a rembg dependency).
          SKD=$("$HOME/.cache/hyperframes/rembg/venv/bin/python" -I -c 'import skimage,os;print(os.path.join(os.path.dirname(skimage.__file__),"data"))')
          cp "$SKD"/astronaut.png "$SKD"/chelsea.png "$SKD"/coffee.png "$SKD"/rocket.jpg "$IN/"
          "$SK/cutout.sh" run "$IN" --out "$W" --plate
          # A clean project offline must come entirely from the cache: no download, no inference.
          rm -rf "$W/cutouts"
          "$SK/cutout.sh" run "$IN" --out "$W" --plate --offline | tee "$RUNNER_TEMP/br-rerun.log"
          grep -q "0 inference(s), 4 cache hit(s)" "$RUNNER_TEMP/br-rerun.log"
          "$SK/cutout.sh" verify "$W"
          "$SK/cutout.sh" cache
          cat "$W/cutouts/CREDITS.md"
          cp .github/workflows/fixtures/background-removal/index.html "$SK/cutout-frame.js" "$W/"
          cp .claude/skills/gsap-hyperframes/gsap-frame.js .claude/skills/gsap-hyperframes/pixelfx-frame.js "$W/"
          cp node_modules/gsap/dist/gsap.min.js node_modules/three/build/three.module.js node_modules/three/build/three.core.js "$W/lib/"
          cp -r node_modules/pixelfx/src/. "$W/lib/pixelfx/"
          cd "$W"
          npx -y hyperframes@0.9.104 lint
          npx -y hyperframes@0.9.104 check
          npx -y hyperframes@0.9.104 render -f 30 -o background-removal.mp4
          frames=$(ffprobe -v error -count_frames -select_streams v -show_entries stream=nb_read_frames -of csv=p=0 background-removal.mp4)
          echo "rendered $frames frames"
          test "$frames" -eq 120

      - name: Sound effects caches (venv, earshot takes)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/hyperframes/earshot
          key: earshot-${{ runner.os }}-${{ hashFiles('.claude/skills/sound-effects/requirements.txt', '.claude/skills/sound-effects/sfx.py') }}
          restore-keys: earshot-${{ runner.os }}-

      - name: Sound effects render (earshot cues on frames, ducked mix, sync check)
        run: |
          set -euo pipefail
          SK="$PWD/.claude/skills/sound-effects"
          W="$RUNNER_TEMP/sound-effects"
          mkdir -p "$W/lib" "$W/audio"
          "$SK/sfx.sh" doctor
          "$SK/sfx.sh" selftest
          cp .github/workflows/fixtures/sound-effects/index.html .github/workflows/fixtures/sound-effects/cues.json "$SK/sfx-frame.js" "$W/"
          cp .claude/skills/gsap-hyperframes/gsap-frame.js "$W/"
          cp node_modules/gsap/dist/gsap.min.js "$W/lib/"
          # Narration stand-in (ffmpeg's flite voice): real projects hand in their ElevenLabs file here.
          ffmpeg -v error -f lavfi -i "flite=text='Every sound lands on its frame. Never over the voice.':voice=slt" -ar 48000 -ac 1 "$W/audio/narration.wav"
          "$SK/sfx.sh" render "$W/cues.json"
          # A fresh project offline must come entirely from the take cache.
          rm -rf "$W/sfx" "$W/audio/mix.wav" "$W/audio/stems"
          "$SK/sfx.sh" render "$W/cues.json" --offline | tee "$RUNNER_TEMP/sfx-rerun.log"
          grep -q "0 made, 7 cache hit(s)" "$RUNNER_TEMP/sfx-rerun.log"
          cat "$W/sfx/CREDITS.md"
          cd "$W"
          npx -y hyperframes@0.9.104 lint
          npx -y hyperframes@0.9.104 check
          npx -y hyperframes@0.9.104 render -f 30 -o sound-effects.mp4
          "$SK/sfx.sh" check "$W" --render sound-effects.mp4

      - name: Creative demos (photo + animated foreground, rigged character, camera)
        run: |
          set -euo pipefail
          FX="$PWD/.github/workflows/fixtures/creative"
          M="$RUNNER_TEMP/creative-media"
          mkdir -p "$M/textures"
          # CC0 photos from scikit-image and their rembg cutouts from the step above.
          cp -r "$RUNNER_TEMP/background-removal/cutouts" "$M/"
          SKD=$("$HOME/.cache/hyperframes/rembg/venv/bin/python" -I -c 'import skimage,os;print(os.path.join(os.path.dirname(skimage.__file__),"data"))')
          cp "$SKD"/brick.png "$SKD"/grass.png "$SKD"/coffee.png "$M/textures/"
          node --test .claude/skills/creative-qc/cqc.test.mjs
          for d in photo-mix:180 character:210 camera:180; do
            demo=${d%%:*}
            W="$RUNNER_TEMP/creative-$demo"
            bash "$FX/stage.sh" "$demo" "$W" "$M"
            (
              cd "$W"
              npx -y hyperframes@0.9.104 lint
              npx -y hyperframes@0.9.104 check
              npx -y hyperframes@0.9.104 render -f 30 -o "$demo.mp4" --quiet
              frames=$(ffprobe -v error -count_frames -select_streams v -show_entries stream=nb_read_frames -of csv=p=0 "$demo.mp4")
              echo "$demo: $frames frames"
              test "$frames" -eq "${d##*:}"
            )
          done

      - name: Creative QC loop (catch a weak cut, repair two scenes, splice, pass)
        run: bash .github/workflows/fixtures/creative/qc-loop.sh "$RUNNER_TEMP/creative-qc" "$RUNNER_TEMP/creative-media"

      - name: Photo search (live, informational)
        continue-on-error: true
        run: node .claude/skills/visual-director/photo-search.mjs search "espresso cup" --limit 3 | head -60

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: media-deps-render
          path: |
            ${{ runner.temp }}/media-deps/out.mp4
            ${{ runner.temp }}/lemo-opuscar/lemo-crt.mp4
            ${{ runner.temp }}/data-animation/data-animation.mp4
            ${{ runner.temp }}/map-animation/map-animation.mp4
            ${{ runner.temp }}/polyhaven/polyhaven.mp4
            ${{ runner.temp }}/polyhaven/polyhaven/manifest.json
            ${{ runner.temp }}/polyhaven/polyhaven/CREDITS.md
            ${{ runner.temp }}/background-removal/background-removal.mp4
            ${{ runner.temp }}/background-removal/cutouts/
            ${{ runner.temp }}/sound-effects/sound-effects.mp4
            ${{ runner.temp }}/sound-effects/sfx/
            ${{ runner.temp }}/creative-*/*.mp4
            ${{ runner.temp }}/creative-qc/qc-*/
            ${{ runner.temp }}/creative-qc/gate-*.json
            bun-lock-resolve.diff
          if-no-files-found: ignore
