<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="lib/gsap.min.js"></script>
    <script src="gsap-frame.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./lib/three/build/three.module.js",
          "three/addons/": "./lib/three/examples/jsm/"
        }
      }
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #101014;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: #101014;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 1280px;
        height: 720px;
      }
      #pixels {
        position: absolute;
        right: 40px;
        top: 40px;
        width: 288px;
        height: 192px;
        image-rendering: pixelated;
      }
      #title {
        position: absolute;
        left: 72px;
        top: 64px;
        font: 700 44px/1.1 sans-serif;
        padding: 12px 18px;
        color: #ffffff;
        background: rgba(0, 0, 0, 0.75);
        border-radius: 8px;
      }
      #credit {
        position: absolute;
        left: 72px;
        bottom: 40px;
        padding: 8px 14px;
        font: 500 20px/1.2 sans-serif;
        color: #ffffff;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1280"
      data-height="720"
    >
      <canvas
        id="stage"
        class="clip"
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-layout-allow-overflow
        width="1280"
        height="720"
      ></canvas>
      <canvas
        id="pixels"
        class="clip"
        data-start="0"
        data-duration="4"
        data-track-index="1"
        width="144"
        height="96"
      ></canvas>
      <div id="title" class="clip" data-start="0" data-duration="4" data-track-index="2">
        Poly Haven<br />in HyperFrames
      </div>
      <div id="credit" class="clip" data-start="0" data-duration="4" data-track-index="3">
        Powered by Poly Haven (CC0)
      </div>
    </div>
    <script>
      const FPS = 30;
      const F = HFGsapFrame;
      const tl = F.createRootTimeline(gsap, { fps: FPS, durationFrames: 120 });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.from(
        "#title",
        { y: 50, opacity: 0, duration: F.frames(18, FPS), ease: "power3.out" },
        F.frames(4, FPS),
      );
      tl.from("#credit", { opacity: 0, duration: F.frames(12, FPS) }, F.frames(14, FPS));
      // Hold render and check until the Poly Haven assets are on the GPU.
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.polyhaven = new Promise((resolve, reject) => {
        window.__polyhavenDone = { resolve, reject };
      });
    </script>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { HDRLoader } from "three/addons/loaders/HDRLoader.js";
      import * as pixelfx from "./lib/pixelfx/core/index.js";
      import * as nova from "./lib/pixelfx/fx/ice/frost-nova.js";
      import { addPixelfxTrack } from "./pixelfx-frame.js";
      import * as PH from "./polyhaven-three.js";

      const renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById("stage"),
        antialias: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(1);
      renderer.setSize(1280, 720, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, 1280 / 720, 0.05, 100);
      const pivot = new THREE.Group();
      scene.add(pivot);
      const draw = (t, p) => {
        const a = -0.6 + p * 1.4;
        camera.position.set(Math.sin(a) * 6.4, 2.4 - p * 0.5, Math.cos(a) * 6.4);
        camera.lookAt(0, 0.45, 0);
        renderer.render(scene, camera);
      };
      HFGsapFrame.addRenderTrack(tl, draw);
      addPixelfxTrack(tl, {
        pixelfx,
        fx: nova,
        ctx: document.getElementById("pixels").getContext("2d"),
        fps: FPS,
        bg: null,
      });

      try {
        const manifest = await PH.loadManifest("polyhaven/manifest.json");
        const [, mat, model] = await Promise.all([
          PH.loadHdri({ THREE, HDRLoader, renderer, scene, manifest, blurriness: 0.25 }),
          PH.loadPbrMaterial({ THREE, manifest, repeat: [2, 2] }),
          PH.loadModel({ GLTFLoader, manifest }),
        ]);
        const plinth = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.7, 0.3, 96), mat.material);
        plinth.position.y = -0.15;
        pivot.add(plinth, PH.fitObject(THREE, model.object, 1.4));
        document.getElementById("credit").textContent = PH.creditLine(manifest);
        draw(tl.time(), tl.time() / tl.duration());
        window.__polyhavenDone.resolve();
      } catch (err) {
        window.__polyhavenDone.reject(err);
        throw err;
      }
    </script>
  </body>
</html>
