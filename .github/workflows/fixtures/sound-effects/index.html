<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="lib/gsap.min.js"></script>
    <script src="gsap-frame.js"></script>
    <script src="sfx/cues.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0b0d14;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        background: #0b0d14;
      }
      #card {
        position: absolute;
        left: 120px;
        top: 150px;
        width: 520px;
        height: 300px;
        border-radius: 22px;
        background: linear-gradient(135deg, #2b59ff, #7b2bff);
      }
      #title {
        position: absolute;
        left: 700px;
        top: 190px;
        font: 800 76px/1.05 sans-serif;
        color: #ffffff;
      }
      #snapdot {
        position: absolute;
        left: 160px;
        top: 190px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #ffffff;
      }
      #logo {
        position: absolute;
        left: 560px;
        top: 500px;
        width: 160px;
        height: 160px;
        border-radius: 32px;
        background: #ffcc00;
        font: 800 64px/160px sans-serif;
        color: #111111;
        text-align: center;
      }
      #flash {
        position: absolute;
        inset: 0;
        width: 1280px;
        height: 720px;
        background: #ffffff;
        opacity: 0;
      }
      #credit {
        position: absolute;
        right: 28px;
        bottom: 24px;
        padding: 8px 14px;
        font: 500 20px/1.2 sans-serif;
        color: #ffffff;
        background: rgba(0, 0, 0, 0.7);
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1280"
      data-height="720"
    >
      <div id="card" class="clip" data-start="0" data-duration="4" data-track-index="0"></div>
      <div id="snapdot" class="clip" data-start="0" data-duration="4" data-track-index="1"></div>
      <div id="title" class="clip" data-start="0" data-duration="4" data-track-index="2">
        Sound<br />on the frame
      </div>
      <div id="logo" class="clip" data-start="0" data-duration="4" data-track-index="3">HF</div>
      <div id="credit" class="clip" data-start="0" data-duration="4" data-track-index="4">
        Sound effects: earshot (MIT), rendered on CPU
      </div>
      <div id="flash" class="clip" data-start="0" data-duration="4" data-track-index="5"></div>
      <audio
        id="mix"
        class="clip"
        src="audio/mix.wav"
        data-start="0"
        data-duration="4"
        data-track-index="6"
        data-volume="1"
      ></audio>
    </div>
    <script type="module">
      import * as S from "./sfx-frame.js";
      const F = HFGsapFrame;
      const FPS = S.cues().fps;
      const tl = F.createRootTimeline(gsap, { fps: FPS, durationFrames: 120 });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      // Every motion is anchored to a cue id from cues.json, so picture and sound share one clock.
      S.land(tl, "card-in", 12, (d) =>
        gsap.from("#card", { x: -760, duration: d, ease: "power3.in" }),
      );
      S.land(tl, "title-slam", 6, (d) =>
        gsap.from("#title", { scale: 2.4, opacity: 0, duration: d, ease: "power4.in" }),
      );
      S.hit(tl, "title-slam", "#flash", { opacity: 0.85 }, { opacity: 0 });
      S.land(
        tl,
        "snap",
        8,
        (d) => gsap.from("#snapdot", { scale: 0, duration: d, ease: "back.out(3)" }),
        { start: true },
      );
      S.land(tl, "build", 54, (d) =>
        gsap.to("#card", { scale: 0.86, rotation: -4, duration: d, ease: "power2.in" }),
      );
      S.hit(tl, "drop", "#card", { scale: 1.08, rotation: 0, background: "#ff3366" }, { scale: 1 });
      S.hit(tl, "drop", "#flash", { opacity: 1 }, { opacity: 0 });
      S.land(
        tl,
        "logo-boing",
        16,
        (d) => gsap.from("#logo", { y: 260, duration: d, ease: "elastic.out(1.2, 0.35)" }),
        { start: true },
      );
    </script>
  </body>
</html>
